name: Build Tweak

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compile ${{ matrix.variant }}
    runs-on: macos-14
    timeout-minutes: 30

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: universal
            archs: "arm64 arm64e"
            suffix: ""
          - variant: arm64e
            archs: "arm64e"
            suffix: "e"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          xcode-select -p || true
          uname -m
          echo "VARIANT=${{ matrix.variant }}"
          echo "ARCHS=${{ matrix.archs }}"

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          SDK_SRC=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs
          mkdir -p "$THEOS/sdks"
          ls "$SDK_SRC"
          for s in "$SDK_SRC"/iPhoneOS*.sdk; do
            echo "copying $s"
            cp -R "$s" "$THEOS/sdks/"
          done
          ls -1 "$THEOS/sdks"

      - name: Install packaging tools
        run: |
          set -euo pipefail
          brew install dpkg ldid
          dpkg-deb --version | head -1
          ldid -h 2>&1 | head -1 || true

      - name: Build
        run: |
          set -euo pipefail
          make clean || true
          make ARCHS="${{ matrix.archs }}" 2>&1 | tee build-${{ matrix.variant }}.log

      - name: Package
        run: |
          set -euo pipefail
          make package ARCHS="${{ matrix.archs }}" FINALPACKAGE=1 2>&1 | tee package-${{ matrix.variant }}.log
          ls -lh packages/

      - name: Rename artifact
        run: |
          set -euo pipefail
          DEB=$(ls packages/*.deb | head -1)
          BASE=$(basename "$DEB" .deb)
          OUT="${BASE}${{ matrix.suffix }}.deb"
          cp "$DEB" "packages/$OUT"
          echo "ARTIFACT=packages/$OUT" >> "$GITHUB_ENV"
          echo "renamed -> $OUT"

      - name: Verify package
        run: |
          set -euo pipefail
          DEB="$ARTIFACT"
          echo "=== file: $DEB ==="
          ls -lh "$DEB"
          echo "=== control fields ==="
          dpkg-deb -f "$DEB" Package
          dpkg-deb -f "$DEB" Version
          dpkg-deb -f "$DEB" Architecture
          echo "=== contents ==="
          dpkg-deb -c "$DEB"
          echo "=== dylib archs (must match declared archs) ==="
          rm -rf /tmp/x && mkdir -p /tmp/x
          dpkg-deb -x "$DEB" /tmp/x
          for f in $(find /tmp/x -name '*.dylib'); do
            python3 - "$f" <<'PY'
          import struct, sys
          p = sys.argv[1]
          b = open(p, "rb").read()
          magic = struct.unpack_from(">I", b, 0)[0]
          if magic in (0xcafebabe, 0xcafebabf):
              n = struct.unpack_from(">I", b, 4)[0]
              print("  FAT with %d archs:" % n)
              for i in range(n):
                  if magic == 0xcafebabe:
                      cpu, sub = struct.unpack_from(">ii", b, 8 + i * 20)
                  else:
                      cpu, sub = struct.unpack_from(">ii", b, 8 + i * 32)
                  if cpu == 0x100000c:
                      name = "arm64e" if (sub & 0x2) else "arm64"
                  else:
                      name = hex(cpu)
                  print("    - %s" % name)
          elif magic == 0xfeedfacf:
              print("  thin arm64/arm64e (LE header)")
          elif magic == 0xcffaedfe:
              print("  thin (BE header, unexpected on iOS)")
          else:
              print("  magic=%#x" % magic)
          PY
          done

      - name: Assert arch matches variant
        run: |
          set -euo pipefail
          DEB="$ARTIFACT"
          rm -rf /tmp/y && mkdir -p /tmp/y
          dpkg-deb -x "$DEB" /tmp/y
          DYLIB=$(find /tmp/y -name '*.dylib' | head -1)
          COUNT=$(python3 - "$DYLIB" <<'PY'
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          magic = struct.unpack_from(">I", b, 0)[0]
          if magic == 0xcafebabe:
              print(struct.unpack_from(">I", b, 4)[0])
          else:
              print(1)
          PY
          )
          echo "arch count in dylib: $COUNT"
          if [ "${{ matrix.variant }}" = "arm64e" ]; then
            [ "$COUNT" = "1" ] || { echo "FAIL: arm64e variant must be thin"; exit 1; }
            echo "OK: thin arm64e"
          else
            [ "$COUNT" = "2" ] || { echo "FAIL: universal variant must be fat with 2 archs"; exit 1; }
            echo "OK: fat dual-arch"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.variant }}-${{ github.sha }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build-${{ matrix.variant }}.log
            package-${{ matrix.variant }}.log
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: List
        run: ls -lh artifacts/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
